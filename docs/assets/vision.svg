  <line x1="556" y1="291" x2="634" y2="291" stroke="#a8834f" stroke-width="2.6"/>
  <text class="h2" x="640" y="242">A public</text>
  <text class="h2" x="640" y="268">library</text>
  <text class="cap" x="560" y="320">For anyone who</text>
  <text class="cap" x="560" y="344">relies on a result</text>
  <rect class="panel" x="792" y="106" width="404" height="256" rx="16"/>
  <text class="mono lab" x="816" y="138">THE WHOLE POOL, ON MUSE SPARK OPEN</text>
  <text class="gold" x="814" y="204" font-weight="700" letter-spacing="-2" style="font-size:68px">$8,500</text>
  <text class="cap" x="816" y="238">One run on each of the 6,552 arXiv</text>
  <text class="cap" x="816" y="262">papers the held-out set was drawn</text>
  <text class="cap" x="816" y="286">from, at the mean of $1.30 a run.</text>
  <line x1="816" y1="302" x2="1172" y2="302" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
  <text class="ink" x="816" y="334" font-weight="700" style="font-size:24px">35 min</text>
  <text class="cap" x="816" y="354" style="font-size:15.5px">median run</text>
  <text class="ink" x="932" y="334" font-weight="700" style="font-size:24px">$1.34</text>
  <text class="cap" x="932" y="354" style="font-size:15.5px">median, at list prices</text>
  <text class="mono lab" x="44" y="412">FIELDS</text>
  <rect x="128" y="390" width="278" height="32" rx="16" fill="#a8834f" fill-opacity="0.22" stroke="#a8834f" stroke-width="1.4"/>
  <text class="mono" x="267.2" y="412" fill="#e6c78f" text-anchor="middle" style="font-size:15.5px">finance, economics · first</text>
