<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="496" viewBox="0 0 1240 496" role="img" aria-labelledby="held-out-t held-out-d">
  <title id="held-out-t">A held-out set nobody had looked at</title>
  <desc id="held-out-d">From 6,552 arXiv hits, 32 finance and economics papers were drawn by a rule written down before any run: public data a script can fetch, LaTeX source, about 30 minutes of compute, and no paper seen during development; 12 were dropped because someone had glimpsed a result. Each paper ran twice on Muse Spark Open at effort xhigh with a $2 budget stop, and 63 runs finished. Verdicts as run, one dot per run: holds up 1, partly holds up 26, does not hold up 3, could not check 28, could not check at the $2 budget stop 5. Could not check is the checker’s own failure, given with its reason, and never counts against the paper.</desc>
