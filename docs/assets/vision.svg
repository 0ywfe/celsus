  <text class="mono m" x="197.2" y="128" text-anchor="middle" style="font-size:15px">commit</text>
  <path d="M250 122 H270 M264 116 L270 122 L264 128" fill="none" stroke="#8c8476" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="chip" x="278.4" y="106" width="128" height="32" rx="16"/>
  <text class="mono m" x="342.4" y="128" text-anchor="middle" style="font-size:15px">tests pass</text>
  <path d="M414 122 H434 M428 116 L434 122 L428 128" fill="none" stroke="#8c8476" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="chip" x="442.4" y="106" width="81" height="32" rx="16"/>
  <text class="mono m" x="482.9" y="128" text-anchor="middle" style="font-size:15px">merge</text>
  <text class="mono lab" x="44" y="182">PAPERS</text>
