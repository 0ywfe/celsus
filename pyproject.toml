[project]
name = "paper-replicator"
version = "0.1.0"
description = "Reads a research paper, reruns its analysis on public data, and reports whether the published numbers reproduce."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.24,<0.25",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_replicator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
