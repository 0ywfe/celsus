[project]
name = "celsus"
version = "0.1.0"
description = "Reads a research paper, reruns its analysis on public data, and reports whether the published numbers reproduce."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "modal>=1.6.3",
    "openai-agents>=0.24,<0.25",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.0",
    "rich>=15",
    "scipy>=1.17.1",
    "yfinance>=1.7.0",
]

[project.scripts]
celsus = "paper_replicator.cli.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_replicator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
