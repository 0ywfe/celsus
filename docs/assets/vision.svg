<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="454" viewBox="0 0 1240 454" role="img" aria-labelledby="vision-t vision-d">
  <title id="vision-t">Continuous integration, for papers</title>
  <desc id="vision-d">Software checks every change before it merges: commit, tests pass, merge. celsus does the same for research: every new empirical paper on public data is checked, with the script, the numbers and the verdict open, and the checked papers build into a public library for anyone who relies on a result. One run on each of the 6,552 arXiv papers the held-out set was drawn from would cost about $8,500, at the mean of $1.30 a run; a run takes a median of 35 minutes and $1.34 at list prices on Muse Spark Open. Finance and economics came first; social science, climate and machine learning, and any field with public data, have the same shape.</desc>
  <style>
    svg { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
    .bg { fill: #1b1a17; }
    .panel { fill: #24221e; stroke: #ffffff; stroke-opacity: 0.09; stroke-width: 1.5; }
    .hi { fill: #2b2721; stroke: #a8834f; stroke-opacity: 0.75; stroke-width: 1.6; }
    .well { fill: #141311; stroke: #ffffff; stroke-opacity: 0.08; stroke-width: 1; }
    .h1 { fill: #efe9dc; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
    .h2 { fill: #efe9dc; font-size: 23px; font-weight: 700; letter-spacing: -0.3px; }
    .cap { fill: #b3ab9a; font-size: 18.5px; }
    .lab { fill: #8c8476; font-size: 13.5px; letter-spacing: 0.7px; }
    .m { fill: #d4ccbb; font-size: 15.5px; }
    .dim { fill: #8c8476; }
    .gold { fill: #d2ab68; }
    .ink { fill: #efe9dc; }
    .seal { fill: none; stroke: #a8834f; stroke-width: 2.4; }
    .tick { fill: none; stroke: #d2ab68; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: none; stroke: #a8834f; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .chip { fill: none; stroke: #efe9dc; stroke-opacity: 0.24; stroke-width: 1.4; }
  </style>
