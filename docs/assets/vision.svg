  <rect class="chip" x="707.8" y="390" width="184" height="32" rx="16"/>
  <text class="mono m" x="800.0" y="412" text-anchor="middle">machine learning</text>
  <text class="cap" x="912.1999999999999" y="412" style="font-size:17px">any field with public data</text>
