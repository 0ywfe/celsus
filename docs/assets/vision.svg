  <circle cx="565" cy="247" r="3" fill="#d8b26e"/>
  <rect x="572" y="228" width="9.5" height="62" fill="#efe9dc" fill-opacity="0.56"/>
  <circle cx="577" cy="237" r="3" fill="#8f7d55"/>
  <rect x="584" y="242" width="9.5" height="48" fill="#efe9dc" fill-opacity="0.62"/>
  <circle cx="589" cy="251" r="3" fill="#8f7d55"/>
  <rect x="596" y="232" width="9.5" height="58" fill="#efe9dc" fill-opacity="0.6799999999999999"/>
  <circle cx="601" cy="241" r="3" fill="#c4553f"/>
  <rect x="608" y="240" width="9.5" height="50" fill="#efe9dc" fill-opacity="0.5"/>
  <circle cx="613" cy="249" r="3" fill="#d8b26e"/>
